<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lại mật khẩu</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #5d6675;
    --line: #d5d9e0; --accent: #1f6feb; --accent-text: #ffffff;
    --ok: #17713a; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b1f27; --text: #eceff4; --muted: #9aa3b2;
      --line: #333a47; --accent: #5a9bff; --accent-text: #0b1220;
      --ok: #5fd08a; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%; max-width: 400px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 28px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  p.hint { margin: 0 0 20px; color: var(--muted); font-size: .92rem; line-height: 1.5; }
  label { display: block; font-size: .88rem; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1rem; color: var(--text);
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; font-size: 1rem; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: .92rem; line-height: 1.5; min-height: 1.2em; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Đặt lại mật khẩu</h1>
  <p class="hint" id="hint">Đang xác thực liên kết...</p>

  <form id="form" hidden>
    <label for="pw">Mật khẩu mới</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
    <label for="pw2">Nhập lại mật khẩu mới</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
    <button id="btn" type="submit">Lưu mật khẩu mới</button>
  </form>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  // SUPABASE_URL và SUPABASE_ANON_KEY được lấy từ config.js
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), hint = $('hint'), btn = $('btn');

  function show(text, kind) { msg.textContent = text; msg.className = kind || ''; }

  // Link hết hạn / sai sẽ có error trong hash, ví dụ #error=access_denied&error_code=otp_expired
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (hashParams.get('error')) {
    hint.textContent = 'Liên kết không dùng được.';
    show(
      (hashParams.get('error_description') || 'Liên kết đã hết hạn hoặc đã được dùng.').replace(/\+/g, ' ') +
      ' Hãy yêu cầu gửi lại email đặt lại mật khẩu.',
      'err'
    );
  } else {
    let ready = false;

    function openForm() {
      if (ready) return;
      ready = true;
      hint.textContent = 'Nhập mật khẩu mới cho tài khoản của bạn.';
      form.hidden = false;
      $('pw').focus();
    }

    // supabase-js tự đọc access_token trong URL và phát sự kiện này
    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') openForm();
    });

    // Dự phòng: nếu sự kiện đã chạy trước khi lắng nghe, kiểm tra session hiện có
    setTimeout(async () => {
      if (ready) return;
      const { data } = await client.auth.getSession();
      if (data.session) openForm();
      else {
        hint.textContent = 'Không tìm thấy liên kết hợp lệ.';
        show('Hãy mở trang này bằng nút "Reset password" trong email mới nhất.', 'err');
      }
    }, 1500);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value, pw2 = $('pw2').value;
    if (pw.length < 6) return show('Mật khẩu cần ít nhất 6 ký tự.', 'err');
    if (pw !== pw2) return show('Hai mật khẩu chưa khớp.', 'err');

    btn.disabled = true;
    show('Đang lưu...');
    const { error } = await client.auth.updateUser({ password: pw });
    if (error) {
      btn.disabled = false;
      return show('Không đổi được mật khẩu: ' + error.message, 'err');
    }
    form.hidden = true;
    hint.textContent = 'Hoàn tất.';
    show('Đã đổi mật khẩu. Bạn có thể đăng nhập bằng mật khẩu mới.', 'ok');
    await client.auth.signOut();
    history.replaceState(null, '', window.location.pathname);
  });
</script>
</body>
</html>
