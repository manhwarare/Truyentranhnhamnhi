<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hộp Truyện – Đọc truyện tranh online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><a class="logo" href="#/">HỘP TRUYỆN</a>
<input id="q" type="search" placeholder="Tìm truyện theo tên hoặc tác giả" aria-label="Tìm truyện"></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = u => (u||'').replace(/["')\\]/g, encodeURIComponent);
const skel = () => `<div class="grid">${'<div class="comic sk"><div class="cv"></div><i></i></div>'.repeat(10)}</div>`;
const err = e => app.innerHTML = `<div class="msg">Không tải được dữ liệu: ${esc(e.message)}. Kiểm tra config.js và đã chạy schema.sql / migration.sql chưa.</div>`;

const SORTS = {new:'Mới cập nhật', top:'Xem nhiều', day:'Top ngày', week:'Top tuần', month:'Top tháng'};
const DAYS = {day:1, week:7, month:30};
const HEAD = {new:'Truyện mới cập nhật', top:'Xem nhiều nhất', day:'Xem nhiều hôm nay', week:'Xem nhiều tuần này', month:'Xem nhiều tháng này'};
let sort = 'new'; try{ sort = localStorage.getItem('sort') || 'new'; }catch(e){} if(!SORTS[sort]) sort = 'new';
const fmt = n => new Intl.NumberFormat('vi-VN',{notation:'compact',maximumFractionDigits:1}).format(n||0);

async function home(term=''){
  const bar = `<div class="sorts" role="tablist" aria-label="Sắp xếp">${Object.entries(SORTS).map(([k,v])=>
    `<button class="chip" role="tab" aria-selected="${k===sort}" data-s="${k}">${v}</button>`).join('')}</div>`;
  app.innerHTML = bar + skel();
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { sort = b.dataset.s; try{localStorage.setItem('sort',sort)}catch(e){}
    home(document.getElementById('q').value.trim()); });
  let rows, error;
  if(DAYS[sort]){
    ({data:rows,error} = await sb.rpc('top_comics',{days:DAYS[sort],lim:60}));
    if(rows && term){ const k = term.toLowerCase(); rows = rows.filter(c => (c.title+' '+(c.author||'')).toLowerCase().includes(k)); }
  } else {
    let q = sb.from('comics').select('id,title,slug,cover_url,author,status,views').limit(60).order(sort==='top'?'views':'updated_at',{ascending:false});
    if(term){ const t = term.replace(/[%,()]/g,' '); q = q.or(`title.ilike.%${t}%,author.ilike.%${t}%`); }
    ({data:rows,error} = await q);
  }
  if(error) return err(error);
  const ranked = sort !== 'new' && !term;
  app.innerHTML = bar +
    `<h1>${term ? 'Kết quả cho “'+esc(term)+'”' : HEAD[sort]}</h1>` +
    (rows.length ? `<div class="grid">${rows.map((c,i)=>`<a class="comic" href="#/c/${esc(c.slug)}">
      <div class="cv" style="background-image:url('${css(c.cover_url)}')">${ranked?`<span class="rk r${i+1}">${i+1}</span>`:''}${sort!=='new'?`<span class="vw">${fmt(c.views)} lượt xem</span>`:''}</div>
      <h3>${esc(c.title)}</h3><small class="${c.status==='completed'?'done':''}">${c.status==='completed'?'Hoàn thành':'Đang tiến hành'}</small></a>`).join('')}</div>`
    : `<p class="empty">${term ? 'Không có truyện phù hợp.' : DAYS[sort] ? 'Chưa có lượt xem nào trong khoảng thời gian này.' : 'Chưa có truyện nào. Vào trang quản trị để thêm truyện đầu tiên.'}</p>`);
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { sort = b.dataset.s; try{localStorage.setItem('sort',sort)}catch(e){}
    home(document.getElementById('q').value.trim()); });
}

async function detail(slug){
  app.innerHTML = skel();
  const {data:c,error} = await sb.from('comics').select('*').eq('slug',slug).maybeSingle();
  if(error) return err(error);
  if(!c) return app.innerHTML = '<p class="empty">Không tìm thấy truyện này.</p>';
  const {data:chs} = await sb.from('chapters').select('id,number,title,created_at').eq('comic_id',c.id).order('number',{ascending:false});
  const vk = 'v:'+c.id; let seen = false; try{ seen = sessionStorage.getItem(vk); }catch(e){}
  if(!seen){ sb.rpc('increment_views',{comic:c.id}).then(()=>{}); try{ sessionStorage.setItem(vk,'1'); }catch(e){} }
  const first = chs?.length ? chs[chs.length-1] : null;
  app.innerHTML = `<div class="detail" style="--bgc:url('${css(c.cover_url)}')"><div class="cv" style="background-image:url('${css(c.cover_url)}')"></div>
    <div><h1>${esc(c.title)}</h1><p class="muted">${esc(c.author||'Đang cập nhật')} · ${c.status==='completed'?'Hoàn thành':'Đang tiến hành'} · ${(c.views+(seen?0:1)).toLocaleString('vi-VN')} lượt xem</p>
    <p>${(c.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</p>
    <p>${esc(c.description||'')}</p>
    ${first?`<a class="btn" href="#/r/${first.id}">Đọc từ chương ${esc(first.number)}</a>`:''}</div></div>
    <h2 style="margin-top:32px">Danh sách chương</h2>
    <div class="chlist">${chs?.length ? chs.map(h=>`<a href="#/r/${h.id}"><span>Chương ${esc(h.number)}${h.title?': '+esc(h.title):''}</span><small>${new Date(h.created_at).toLocaleDateString('vi-VN')}</small></a>`).join('') : '<p class="empty">Chưa có chương nào.</p>'}</div>`;
  document.title = c.title + ' – Hộp Truyện';
}

async function reader(id){
  app.innerHTML = '<p class="empty">Đang tải…</p>';
  const {data:h,error} = await sb.from('chapters').select('*, comics(title,slug)').eq('id',id).maybeSingle();
  if(error) return err(error);
  if(!h) return app.innerHTML = '<p class="empty">Không tìm thấy chương này.</p>';
  const {data:all} = await sb.from('chapters').select('id,number,title').eq('comic_id',h.comic_id).order('number',{ascending:false});
  const list = all || [];
  const idx = list.findIndex(x => String(x.id) === String(h.id));
  const next = idx > 0 ? list[idx-1] : null, prev = idx >= 0 ? list[idx+1] : null;
  const IC_LIST = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>';
  const IC_REF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>';
  const nav = `<div class="bar">
    ${prev?`<a class="btn alt" href="#/r/${prev.id}">Chương trước</a>`:''}
    <button class="btn alt" type="button" data-toc aria-haspopup="dialog">${IC_LIST}<span>Chương</span></button>
    <button class="btn alt ic" type="button" data-refresh aria-label="Tải lại trang" title="Tải lại trang">${IC_REF}</button>
    ${next?`<a class="btn" href="#/r/${next.id}">Chương sau</a>`:''}</div>`;
  const IC_PREV = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
  const IC_NEXT = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  const dock = `<div class="dock" role="navigation" aria-label="Điều hướng chương">
    ${prev?`<a class="d" href="#/r/${prev.id}" aria-label="Chương trước" title="Chương trước">${IC_PREV}</a>`:`<span class="d off" aria-hidden="true">${IC_PREV}</span>`}
    <button class="d" type="button" data-toc aria-haspopup="dialog" aria-label="Danh sách chương" title="Danh sách chương">${IC_LIST}</button>
    <button class="d" type="button" data-refresh aria-label="Tải lại trang" title="Tải lại trang">${IC_REF}</button>
    ${next?`<a class="d go" href="#/r/${next.id}" aria-label="Chương sau" title="Chương sau">${IC_NEXT}</a>`:`<span class="d off" aria-hidden="true">${IC_NEXT}</span>`}</div>`;
  const sheet = `<div class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-box" role="dialog" aria-modal="true" aria-label="Danh sách chương">
      <div class="sheet-h"><strong>${esc(h.comics.title)}</strong><button type="button" class="x" data-close aria-label="Đóng">✕</button></div>
      <div class="sheet-l">${list.map(x=>`<a href="#/r/${x.id}" class="${String(x.id)===String(h.id)?'cur':''}"${String(x.id)===String(h.id)?' aria-current="true"':''}>Chương ${esc(x.number)}${x.title?': '+esc(x.title):''}</a>`).join('')}</div>
      <a class="sheet-f" href="#/c/${esc(h.comics.slug)}">Về trang truyện</a>
    </div></div>`;
  app.innerHTML = `<div class="reader"><h2 style="text-align:center">${esc(h.comics.title)} – Chương ${esc(h.number)}</h2>${nav}
    ${h.pages.map((p,i)=>`<img src="${esc(p)}" alt="Trang ${i+1}" loading="lazy">`).join('')}${nav}${sheet}${dock}</div>`;
  const sh = app.querySelector('.sheet');
  const setSheet = open => { sh.hidden = !open; document.documentElement.classList.toggle('lock', open);
    if(open) sh.querySelector('.cur')?.scrollIntoView({block:'center'}); };
  app.querySelectorAll('[data-toc]').forEach(b => b.onclick = () => setSheet(true));
  app.querySelectorAll('[data-refresh]').forEach(b => b.onclick = () => location.reload());
  sh.addEventListener('click', e => { if(e.target.closest('[data-close],a')) setSheet(false); });
  window.scrollTo(0,0); document.title = `${h.comics.title} – Chương ${h.number}`;
}

function route(){
  document.documentElement.classList.remove('lock');
  const [,k,v] = location.hash.split('/');
  if(k==='c') detail(decodeURIComponent(v)); else if(k==='r') reader(v); else home();
}
addEventListener('hashchange', route); route();
addEventListener('keydown', e => { if(e.key==='Escape'){ const s=document.querySelector('.sheet:not([hidden])'); if(s){ s.hidden=true; document.documentElement.classList.remove('lock'); } } });
let t; document.getElementById('q').addEventListener('input', e => { clearTimeout(t);
  t = setTimeout(()=>{ if(location.hash.length>2) location.hash='#/'; home(e.target.value.trim()); }, 300); });
</script></body></html>
