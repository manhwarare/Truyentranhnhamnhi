<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị – Hộp Truyện</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><a class="logo" href="admin.html">QUẢN TRỊ</a><a href="index.html" style="margin-left:auto">Xem trang đọc truyện</a>
<button id="out" class="btn sm alt" hidden>Đăng xuất</button></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const note = (m,bad) => { const d=document.createElement('div'); d.className='msg'; d.textContent=m; if(bad) d.style.background='var(--red)', d.style.color='#fff'; app.prepend(d); setTimeout(()=>d.remove(),4000); };
async function upload(file, path){
  const {error} = await sb.storage.from('comics').upload(path, file, {upsert:true, contentType:file.type});
  if(error) throw error; return sb.storage.from('comics').getPublicUrl(path).data.publicUrl;
}
const safeName = n => n.replace(/[^a-zA-Z0-9._-]/g,'_');

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return login();
  const {data:ad} = await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  if(!ad){ app.innerHTML='<div class="card"><h2>Chưa có quyền quản trị</h2><p>Tài khoản này chưa nằm trong bảng admins. Xem hướng dẫn cuối file schema.sql.</p></div>'; out.hidden=false; return; }
  out.hidden=false; listComics();
}
out.onclick = async()=>{ await sb.auth.signOut(); out.hidden=true; login(); };

function login(){
  app.innerHTML = `<form class="card" id="f" style="max-width:420px;margin:40px auto"><h2>Đăng nhập quản trị</h2>
    <label for="em">Email</label><input id="em" type="email" required autocomplete="username">
    <label for="pw">Mật khẩu</label><input id="pw" type="password" required autocomplete="current-password">
    <p><button class="btn">Đăng nhập</button></p></form>`;
  f.onsubmit = async e => { e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:em.value,password:pw.value});
    error ? note('Đăng nhập thất bại: '+error.message,1) : boot(); };
}

async function listComics(){
  const {data,error} = await sb.from('comics').select('id,title,status,views').order('created_at',{ascending:false});
  if(error) return note(error.message,1);
  app.innerHTML = `<div class="row" style="border:0;padding:0 0 12px"><h1>Quản lý truyện</h1><button class="btn" id="add">Thêm truyện mới</button></div>
    <div class="chlist" style="max-height:none">${data.length?data.map(c=>`<div class="row"><span><b>${esc(c.title)}</b> <small class="muted">${c.views} lượt xem</small></span>
    <span><button class="btn sm alt" data-ch="${c.id}">Chương</button> <button class="btn sm alt" data-ed="${c.id}">Sửa</button> <button class="btn sm del" data-del="${c.id}">Xoá</button></span></div>`).join(''):'<p class="empty">Chưa có truyện nào. Bấm “Thêm truyện mới” để bắt đầu.</p>'}</div>`;
  add.onclick = ()=>comicForm();
  app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>comicForm(b.dataset.ed));
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>chapters(b.dataset.ch));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Xoá truyện này cùng toàn bộ chương?')) return;
    const {error}=await sb.from('comics').delete().eq('id',b.dataset.del); error?note(error.message,1):listComics(); });
}

async function comicForm(id){
  const c = id ? (await sb.from('comics').select('*').eq('id',id).single()).data : {genres:[],status:'ongoing'};
  app.innerHTML = `<form class="card" id="f"><h2>${id?'Sửa truyện':'Thêm truyện mới'}</h2><div class="form2">
    <div><label for="t">Tên truyện</label><input id="t" required value="${esc(c.title)}"></div>
    <div><label for="a">Tác giả</label><input id="a" value="${esc(c.author)}"></div>
    <div><label for="s">Trạng thái</label><select id="s"><option value="ongoing">Đang tiến hành</option><option value="completed">Hoàn thành</option></select></div>
    <div><label for="g">Thể loại (cách nhau bằng dấu phẩy)</label><input id="g" value="${esc((c.genres||[]).join(', '))}"></div></div>
    <label for="d">Mô tả</label><textarea id="d" rows="4">${esc(c.description)}</textarea>
    <label for="cv">Ảnh bìa ${c.cover_url?'(để trống nếu giữ ảnh cũ)':''}</label><input id="cv" type="file" accept="image/*">
    <p><button class="btn">Lưu truyện</button> <button type="button" class="btn alt" id="back">Huỷ</button></p></form>`;
  s.value = c.status; back.onclick = listComics;
  f.onsubmit = async e => { e.preventDefault(); const btn=f.querySelector('.btn'); btn.disabled=true;
    try{
      const row = {title:t.value.trim(), author:a.value.trim()||null, status:s.value, description:d.value.trim()||null,
        genres:g.value.split(',').map(x=>x.trim()).filter(Boolean)};
      if(!id) row.slug = slugify(row.title)+'-'+Date.now().toString(36).slice(-4);
      if(cv.files[0]) row.cover_url = await upload(cv.files[0], `covers/${Date.now()}-${safeName(cv.files[0].name)}`);
      const {error} = id ? await sb.from('comics').update(row).eq('id',id) : await sb.from('comics').insert(row);
      if(error) throw error; listComics();
    }catch(x){ note('Lỗi: '+x.message,1); btn.disabled=false; } };
}

async function chapters(comicId){
  const [{data:c},{data:chs}] = await Promise.all([
    sb.from('comics').select('title').eq('id',comicId).single(),
    sb.from('chapters').select('id,number,title,pages').eq('comic_id',comicId).order('number',{ascending:false})]);
  app.innerHTML = `<button class="btn alt sm" id="back">Quay lại danh sách truyện</button><h1 style="margin:16px 0">${esc(c.title)}</h1>
    <form class="card" id="f"><h2>Thêm chương</h2><div class="form2">
    <div><label for="n">Số chương</label><input id="n" type="number" step="0.1" required></div>
    <div><label for="t">Tên chương (không bắt buộc)</label><input id="t"></div></div>
    <label for="p">Ảnh các trang (chọn nhiều ảnh, sắp xếp theo tên file)</label><input id="p" type="file" accept="image/*" multiple required>
    <p><button class="btn">Đăng chương</button> <span id="prog" class="muted"></span></p></form>
    <div class="chlist" style="max-height:none">${chs.length?chs.map(h=>`<div class="row"><span>Chương ${esc(h.number)}${h.title?': '+esc(h.title):''} <small class="muted">${h.pages.length} trang</small></span>
    <button class="btn sm del" data-del="${h.id}">Xoá</button></div>`).join(''):'<p class="empty">Truyện này chưa có chương.</p>'}</div>`;
  back.onclick = listComics;
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Xoá chương này?')) return;
    const {error}=await sb.from('chapters').delete().eq('id',b.dataset.del); error?note(error.message,1):chapters(comicId); });
  f.onsubmit = async e => { e.preventDefault(); const btn=f.querySelector('.btn'); btn.disabled=true;
    try{
      const files = [...p.files].sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true})), urls=[];
      for(const [i,file] of files.entries()){ prog.textContent=`Đang tải ${i+1}/${files.length}…`;
        urls.push(await upload(file, `${comicId}/${n.value}/${String(i).padStart(3,'0')}-${safeName(file.name)}`)); }
      const {error} = await sb.from('chapters').insert({comic_id:comicId, number:+n.value, title:t.value.trim()||null, pages:urls});
      if(error) throw error; chapters(comicId);
    }catch(x){ note('Lỗi: '+x.message,1); btn.disabled=false; prog.textContent=''; } };
}
boot();
</script></body></html>
